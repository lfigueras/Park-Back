# Render Blueprint for ParkBack — https://render.com/docs/blueprint-spec
databases:
  - name: parkback-db
    plan: free
    databaseName: parkback_production
    user: parkback

services:
  - type: web
    name: parkback
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parkback-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false            # paste the contents of config/master.key in the Render dashboard
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"          # run the job supervisor inside Puma (no separate worker)
    # Persistent storage for uploaded photos (Active Storage :local).
    # Disks require a paid instance type — uncomment after upgrading from `free`.
    # disk:
    #   name: storage
    #   mountPath: /opt/render/project/src/storage
    #   sizeGB: 1
