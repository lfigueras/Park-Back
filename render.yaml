# Render Blueprint for ParkBack — deployed as a Docker service (same setup as the portfolio).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: parkback
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false            # paste the contents of config/master.key in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: parkback-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"          # run the job supervisor inside Puma (no separate worker)

databases:
  - name: parkback-db
    databaseName: parkback_production
    user: parkback
    plan: free
    region: singapore
