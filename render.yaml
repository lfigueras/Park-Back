# Render Blueprint for ParkBack — deployed as a Docker service (same setup as the portfolio).
# ParkBack uses the existing Render Postgres instance. Set its internal connection
# URL as DATABASE_URL in the Render dashboard; do not commit the URL.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: parkback
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false            # paste the contents of config/master.key
      - key: DATABASE_URL
        sync: false            # set the existing Render Postgres internal URL
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: PORT
        value: "10000"
      - key: SOLID_QUEUE_IN_PUMA
        value: "false"         # ParkBack currently has no background jobs to process
